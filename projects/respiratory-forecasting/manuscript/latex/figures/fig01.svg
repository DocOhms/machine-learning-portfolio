<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
<rect width="1500" height="1060" fill="white"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#536b83"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="750" y="42" text-anchor="middle" font-size="30" font-weight="700" fill="#24354a">One-week-ahead surveillance forecasting</text>
<text x="750" y="76" text-anchor="middle" font-size="21" font-weight="400" fill="#24354a">Three independent fits: NSSP  |  contemporary ILINet  |  historical ILINet</text>
<rect x="245" y="105" width="1010" height="112" rx="10" fill="#f1f5f9" stroke="#52677e" stroke-width="2"/><text x="750" y="137" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Availability-aligned inputs</text><text x="750" y="171" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Target lags 1–3 • prior-three-week summaries • annual phase • lag-1 auxiliary signals</text><text x="750" y="199" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Target week t uses completed surveillance observations through t−1.</text>
<path d="M750,217 L750,252" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/>
<rect x="245" y="252" width="1010" height="100" rx="10" fill="#f1f5f9" stroke="#52677e" stroke-width="2"/><text x="750" y="284" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Chronological partition by complete surveillance weeks</text><text x="750" y="318" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Earlier fit segment → later pre-test validation → subsequent test window</text>
<path d="M490,352 L490,395" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/><path d="M1110,352 L1110,395" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="395" width="880" height="265" rx="12" fill="#edf4fb" stroke="#3474a5" stroke-width="2"/>
<text x="500" y="429" text-anchor="middle" font-size="23" font-weight="700" fill="#24577e">PHASE 1  •  estimate weights within pre-test history</text>
<rect x="85" y="452" width="325" height="175" rx="10" fill="#ffffff" stroke="#52677e" stroke-width="2"/><text x="247.5" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Fit segment</text><text x="247.5" y="518" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Fit scaler + K-means</text><text x="247.5" y="546" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">One-hot cluster assignment</text><text x="247.5" y="574" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Train RF, GBR, and MLP</text>
<path d="M410,539 L460,539" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/>
<rect x="475" y="452" width="435" height="175" rx="10" fill="#ffffff" stroke="#52677e" stroke-width="2"/><text x="692.5" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Later validation segment</text><text x="692.5" y="518" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Apply stored preprocessing</text><text x="692.5" y="546" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Predict with the three learners</text><text x="692.5" y="574" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Normalize inverse-MSE weights</text>
<rect x="980" y="395" width="455" height="265" rx="10" fill="#fff5e8" stroke="#52677e" stroke-width="2"/><text x="1207.5" y="427" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Classical benchmark branch</text><text x="1207.5" y="461" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Fit ARIMA / annual SARIMA</text><text x="1207.5" y="489" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">per geographic target series</text><text x="1207.5" y="517" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Select orders on chronological</text><text x="1207.5" y="545" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">validation RMSE, then MAE</text><text x="1207.5" y="573" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Apply prediction-coverage gate</text>
<path d="M500,660 L500,710" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/><path d="M1205,660 L1205,710" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="710" width="880" height="117" rx="10" fill="#edf4fb" stroke="#52677e" stroke-width="2"/><text x="500" y="742" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">PHASE 2  •  refit on all pre-test history</text><text x="500" y="776" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Rebuild scaler, K-means, RF, GBR, and MLP</text><text x="500" y="804" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Freeze validation-derived ensemble weights</text>
<rect x="980" y="710" width="455" height="117" rx="10" fill="#fff5e8" stroke="#52677e" stroke-width="2"/><text x="1207.5" y="742" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Classical full-pretest refit</text><text x="1207.5" y="776" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Refit selected orders</text><text x="1207.5" y="804" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Fixed parameters; rolling observations</text>
<path d="M500,827 L500,872" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/><path d="M1205,827 L1205,872" fill="none" stroke="#536b83" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="872" width="1375" height="100" rx="10" fill="#f0f6ed" stroke="#52677e" stroke-width="2"/><text x="747.5" y="904" text-anchor="middle" font-size="22" font-weight="700" fill="#24354a">Common test rows and descriptive outputs</text><text x="747.5" y="938" text-anchor="middle" font-size="18" font-weight="400" fill="#24354a">Component / hybrid / naive / classical metrics • weekly curves • residuals • state heat maps</text>
<text x="750" y="1007" text-anchor="middle" font-size="19" font-weight="400" fill="#7b3a23">Within-run fitting excludes test outcomes. These historical windows were inspected during development;</text>
<text x="750" y="1035" text-anchor="middle" font-size="19" font-weight="400" fill="#7b3a23">results are retrospective exploratory comparisons, not untouched confirmation (Section III.G).</text>
</g></svg>