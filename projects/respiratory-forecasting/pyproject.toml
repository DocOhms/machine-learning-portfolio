[project]
name = "ieee-respiratory-forecasting"
version = "1.0.0"
description = "Leakage-safe hybrid forecasting across NSSP and ILINet respiratory surveillance data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "matplotlib==3.11.0",
  "plotly==6.9.0",
  "kaleido==1.3.0",
  "statsmodels==0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
